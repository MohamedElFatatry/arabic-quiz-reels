          import os,sys,json,math,re,wave,array,subprocess,shutil,random,asyncio
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          import arabic_reshaper
          from bidi.algorithm import get_display
          W,H,FPS,DURATION=720,1280,10,50
          FONT='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          PALETTES=['#5EEAD4','#A78BFA','#FBBF24','#60A5FA','#FB7185','#4ADE80']
          FONTS={}
          def font(size):
              if size not in FONTS: FONTS[size]=ImageFont.truetype(FONT,size,layout_engine=ImageFont.Layout.BASIC)
              return FONTS[size]
          def rtl(s): return get_display(arabic_reshaper.reshape(str(s)))
          def lines(s,size,width):
              out=[]; current=''
              for word in str(s).split():
                  attempt=(current+' '+word).strip()
                  if font(size).getlength(rtl(attempt))>width and current: out.append(current); current=word
                  else: current=attempt
              if current: out.append(current)
              return out
          
          def label(draw,s,y,size=40,color='white',width=570,maxlines=3):
              while len(lines(s,size,width))>maxlines and size>20: size-=2
              wrapped=lines(s,size,width)
              if len(wrapped)>maxlines: raise ValueError('Text too long')
              for i,line in enumerate(wrapped): draw.text((360,y+(i-(len(wrapped)-1)/2)*size*1.35),rtl(line),font=font(size),fill=color,anchor='mm')
          
          def narration(text,path):
              import edge_tts
              async def generate():
                  for attempt in range(3):
                      try:
                          await edge_tts.Communicate(text, 'ar-EG-SalmaNeural', rate='+5%').save(str(path))
                          return
                      except Exception:
                          if attempt==2: raise
                          await asyncio.sleep(1+attempt)
              asyncio.run(generate())
              pcm=path.with_suffix('.wav')
              subprocess.run(['ffmpeg','-v','error','-y','-i',str(path),'-ar','16000','-ac','1','-c:a','pcm_s16le',str(pcm)],check=True)
              with wave.open(str(pcm),'rb') as wav:
                  data=array.array('h',wav.readframes(wav.getnframes()))
              if len(data)<1600: raise RuntimeError('Empty voice; video will not publish')
              return data
          
          def prepare_audio(short,folder):
              # Spoken input includes questions and explanations; choices and answer labels are excluded.
              clips=[]
              intro=narration(short['hook']+'، خمسة أسئلة. احسب نتيجتك.',folder/'intro.mp3')
              intro_end=math.ceil((len(intro)/16000+.3)*10)/10
              clips.append((0,intro)); timeline=[]; current=intro_end
              for qi,q in enumerate(short['questions']):
                  question=narration(q['q'],folder/f'q{qi}.mp3')
                  fact=narration(q['fact'],folder/f'fact{qi}.mp3')
                  reading=math.ceil((len(question)/16000+.3)*10)/10
                  reveal=current+reading+5
                  end=math.ceil((reveal+max(3,len(fact)/16000+.7))*10)/10
                  timeline.append(dict(start=current,reading=reading,reveal=reveal,end=end))
                  clips.extend([(current,question),(reveal+.4,fact)])
                  current=end
              outro=narration('كم إجابة صحيحة من خمسة؟ اكتب نتيجتك في التعليقات.',folder/'outro.mp3')
              clips.append((current,outro)); duration=math.ceil((current+len(outro)/16000+.5)*10)/10
              if duration>175: raise RuntimeError('Voice timing exceeds Short limit')
              samples=array.array('h',[0])*int(duration*16000)
              def mix(start,data,gain=1):
                  offset=int(start*16000)
                  for j,x in enumerate(data):
                      if offset+j<len(samples): samples[offset+j]=max(-32767,min(32767,samples[offset+j]+int(x*gain)))
              def tone(start,freq,length=.09,amplitude=.12):
                  total=int(length*16000)
                  mix(start,[int(32767*amplitude*math.sin(math.pi*j/total)**2*math.sin(2*math.pi*freq*j/16000)) for j in range(total)])
              for start,data in clips: mix(start,data)
              for segment in timeline:
                  countdown=segment['start']+segment['reading']
                  for j in range(5): tone(countdown+j,900 if j<3 else 1150)
                  tone(segment['reveal'],659,.18)
              path=folder/'mixed.wav'
              with wave.open(str(path),'wb') as wav:
                  wav.setnchannels(1); wav.setsampwidth(2); wav.setframerate(16000); wav.writeframes(samples.tobytes())
              return timeline,intro_end,current,duration,path
          
          def frame(short,t,index,timing=None):
              timeline,intro_end,outro_start,duration=timing if timing else ([dict(start=2+qi*9,reading=1,reveal=8+qi*9,end=11+qi*9) for qi in range(5)],2,47,50)
              accent=PALETTES[index%len(PALETTES)]
              im=Image.new('RGB',(W,H),'#0B1220'); d=ImageDraw.Draw(im)
              for k in range(12):
                  x=int(360+320*math.sin(k*2.3+t*.12)); y=int(640+580*math.cos(k*1.7+t*.1))
                  d.ellipse((x-3,y-3,x+3,y+3),fill='#27354C')
              d.rounded_rectangle((55,80,665,1210),28,outline='#26354B',width=2)
              d.text((90,130),'iQuiz',font=font(42),fill=accent,anchor='lm')
              label(d,short['topic'],205,34,accent)
              if t<intro_end:
                  label(d,short['hook'],455,46)
                  label(d,'٥ أسئلة · احسب نتيجتك',690,35,accent)
                  label(d,'هل تكملها ٥ من ٥؟',850,42)
              elif t>=outro_start:
                  label(d,'كام إجابة صح من ٥؟',440,46)
                  label(d,'اكتب نتيجتك في التعليقات',610,36,accent)
                  label(d,'تحدٍّ جديد على iQuiz',790,38)
              else:
                  qi=next(i for i,segment in enumerate(timeline) if segment['start']<=t<segment['end']); segment=timeline[qi]; elapsed=t-segment['start']; q=short['questions'][qi]; reveal=t>=segment['reveal']
                  label(d,f'السؤال {qi+1} من 5',275,27,'#94A3B8')
                  label(d,q['q'],375,40)
                  for oi,opt in enumerate(q['options']):
                      top=500+oi*118; correct=reveal and oi==q['answer']
                      d.rounded_rectangle((82,top,638,top+96),20,fill='#115E4B' if correct else '#1B2940',outline=accent if correct else '#32435E',width=3 if correct else 1)
                      label(d,opt,top+48,34,width=480,maxlines=2)
                  if reveal:
                      label(d,'الإجابة الصحيحة',915,29,accent)
                      label(d,q['fact'],1005,28,'#E2E8F0')
                  elif elapsed<segment['reading']: label(d,'ركز في السؤال',955,34,accent)
                  else:
                      remain=max(1,5-int(elapsed-segment['reading'])); pulse=math.sin(t*math.pi*2)*3
                      d.ellipse((316-pulse,887-pulse,404+pulse,975+pulse),outline=accent,width=4)
                      label(d,str(remain),932,47,accent)
                      label(d,'اختر قبل انتهاء الوقت',1020,27,'#94A3B8')
              d.rounded_rectangle((85,1130,635,1138),4,fill='#26354B')
              end=85+int(550*min(1,t/duration))
              if end>85: d.rounded_rectangle((85,1130,end,1138),4,fill=accent)
              label(d,'اختبر معلوماتك',1170,24,'#94A3B8')
              return im
          
          def render(short,index,outdir):
              root=Path(outdir); root.mkdir(parents=True,exist_ok=True)
              folder=root/('frames-'+short['id']); folder.mkdir(exist_ok=True)
              timeline,intro_end,outro_start,duration,wav=prepare_audio(short,folder)
              timing=(timeline,intro_end,outro_start,duration)
              for i in range(round(duration*FPS)): frame(short,i/FPS,index,timing).save(folder/f'{i:04d}.png')
              video=root/(short['id']+'.mp4')
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-framerate',str(FPS),'-i',str(folder/'%04d.png'),'-i',str(wav),'-c:v','libx264','-preset','veryfast','-crf','21','-r','30','-pix_fmt','yuv420p','-c:a','aac','-b:a','128k','-movflags','+faststart','-t',str(duration),str(video)],check=True)
              shutil.rmtree(folder)
              return video
          
          def metadata(short):
              title=f"{short['hook']} | {short['topic']} #Shorts"
              if len(title)>100: raise ValueError('Title too long')
              answers='\n'.join(f"{i+1}. {q['q']}\nالإجابة: {q['options'][q['answer']]} — {q['fact']}" for i,q in enumerate(short['questions']))
              desc=f"٥ أسئلة عن {short['topic']} مع تعليق صوتي عربي. أمامك ٥ ثوانٍ للاختيار في كل سؤال. احسب نتيجتك من ٥!\nاكتب نتيجتك والموضوع الذي تريده في التحدي القادم.\n\nالإجابات والتفسير:\n{answers}\n"
              if short['sources']: desc+='\nمصادر المعلومات:\n'+'\n'.join(short['sources'])+'\n'
              else: desc+='\nالإجابات الحسابية والمنطقية موضحة أعلاه.\n'
              desc+=f"\n#Shorts #اختبر_معلوماتك #{short['hashtag']} #iQuiz\n\nQuiz ID: {short['id']}"
              return dict(snippet=dict(title=title,description=desc,tags=['iQuiz','اختبر معلوماتك',short['topic'],'مسابقة عربية','Arabic quiz'],categoryId='27',defaultLanguage='ar'),status=dict(privacyStatus='public',selfDeclaredMadeForKids=False,license='youtube',embeddable=True))
          
          def published_ids(youtube,playlist):
              found=set(); page=None
              for _ in range(200):
                  args=dict(part='snippet',playlistId=playlist,maxResults=50)
                  if page: args['pageToken']=page
                  result=youtube.playlistItems().list(**args).execute(num_retries=3)
                  for item in result.get('items',[]): found.update(re.findall(r'Quiz ID: (iq-v2-[a-z]+)',item.get('snippet',{}).get('description','')))
                  page=result.get('nextPageToken')
                  if not page: return found
              raise RuntimeError('History scan limit reached; nothing uploaded')
          
          PHASE='start'
          def publish():
              global PHASE
              from google.oauth2.credentials import Credentials
              from google.auth.transport.requests import Request
              from googleapiclient.discovery import build
              from googleapiclient.http import MediaFileUpload
              if int(os.environ.get('GITHUB_RUN_ATTEMPT','1'))>1: raise RuntimeError('Reruns blocked; check Studio and start a new run')
              names=['YOUTUBE_CLIENT_ID','YOUTUBE_CLIENT_SECRET','YOUTUBE_REFRESH_TOKEN']; values={n:os.environ.get(n,'').strip() for n in names}
              if any(not v for v in values.values()): raise RuntimeError('Missing repository secret')
              PHASE='refresh-token'
              credentials=Credentials(token=None,refresh_token=values[names[2]],token_uri='https://oauth2.googleapis.com/token',client_id=values[names[0]],client_secret=values[names[1]])
              credentials.refresh(Request()); print('::add-mask::'+credentials.token,flush=True)
              youtube=build('youtube','v3',credentials=credentials,cache_discovery=False)
              PHASE='check-channel'
              channels=youtube.channels().list(part='snippet,contentDetails',mine=True).execute(num_retries=3).get('items',[])
              if len(channels)!=1 or channels[0]['id']!='UCMpEO85fSUFPQz2EAjqsytw': raise RuntimeError('Wrong authorized channel; nothing uploaded')
              PHASE='read-upload-history'; completed=published_ids(youtube,channels[0]['contentDetails']['relatedPlaylists']['uploads'])
              count=int(os.environ.get('BATCH_COUNT','1'))
              if count not in (1,3,6): raise RuntimeError('Invalid batch count')
              selected=[(i,s) for i,s in enumerate(BANK) if s['id'] not in completed][:count]
              Path('output').mkdir(exist_ok=True)
              summary_path=Path(os.environ.get('GITHUB_STEP_SUMMARY','output/summary.md'))
              if not selected:
                  print('All 36 Shorts already uploaded. Nothing duplicated.')
                  summary_path.write_text('All 36 Shorts already uploaded. Add new questions to continue.',encoding='utf-8'); return
              summary=[]
              for index,short in selected:
                  PHASE='render-video'; print('Rendering '+short['id'],flush=True); video=render(short,index,'output'); payload=metadata(short)
                  Path('output',short['id']+'.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
                  PHASE='upload-video'; response=None
                  request=youtube.videos().insert(part='snippet,status',body=payload,notifySubscribers=False,media_body=MediaFileUpload(str(video),mimetype='video/mp4',chunksize=8*1024*1024,resumable=True))
                  while response is None: _,response=request.next_chunk(num_retries=3)
                  vid=response.get('id','')
                  if not re.fullmatch('[A-Za-z0-9_-]{11}',vid): raise RuntimeError('Missing video ID; check Studio')
                  url='https://www.youtube.com/watch?v='+vid; status=response.get('status',{}).get('privacyStatus','unknown')
                  summary.append(f'- [{short["topic"]}]({url}) — visibility: {status}')
                  summary_path.write_text('## iQuiz Shorts\n\n'+'\n'.join(summary),encoding='utf-8')
                  print('Uploaded '+short['id']+' '+url+' '+status,flush=True); completed.add(short['id'])
                  if status!='public': raise RuntimeError('Non-public visibility returned; check Studio before continuing')
          
          def safe_error(exc):
              known={'invalid_grant','invalid_client','unauthorized_client','access_denied','invalid_scope','quotaExceeded','uploadLimitExceeded','forbidden','insufficientPermissions'}; code='unknown'
              for arg in getattr(exc,'args',()):
                  if isinstance(arg,dict) and isinstance(arg.get('error'),str) and arg['error'] in known: code=arg['error']
              http=getattr(getattr(exc,'resp',None),'status',None)
              if getattr(exc,'content',None):
                  try:
                      body=json.loads(exc.content)
                      for item in body.get('error',{}).get('errors',[]):
                          if item.get('reason') in known: code=item['reason']
                  except Exception: pass
              typename=type(exc).__name__
              if not re.fullmatch(r'[A-Za-z0-9_]+',typename): typename='Error'
              print(f'::error::Phase={PHASE}; type={typename}; code={code}; HTTP={http}. Check Studio before another upload run.')
          
          if __name__=='__main__':
              if '--preview' in sys.argv:
                  index=int(sys.argv[sys.argv.index('--preview')+1]); print(render(BANK[index],index,'output'))
              else:
                  try: publish()
                  except Exception as exc: safe_error(exc); sys.exit(1)
