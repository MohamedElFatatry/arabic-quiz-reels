name: iQuiz - Publish Arabic Shorts

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'How many new Shorts to publish?'
        type: choice
        options: ['1', '3', '6']
        default: '3'
  schedule:
    - cron: '17 6,12,18 * * *'

permissions:
  contents: read

concurrency:
  group: iquiz-youtube-upload
  cancel-in-progress: false

jobs:
  publish-shorts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install Pillow arabic-reshaper python-bidi google-api-python-client google-auth edge-tts
      - name: Create and publish new topic Shorts
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          BATCH_COUNT: ${{ inputs.count || '1' }}
        run: |
          mkdir -p output
          python <<'PYCODE'
